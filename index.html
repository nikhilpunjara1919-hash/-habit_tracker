<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Habit Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Firebase SDK (Version 8 Compat for easy single-file use) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root {
            --bg-color: #ffffff;
            --text-primary: #111111;
            --text-secondary: #555555;
            --border-color: #d9d9d9;
            --border-light: #eeeeee;
            --color-green: #2ecc71;
            --color-blue: #3498db;
            --color-yellow: #f1c40f;
            --color-red: #e74c3c;
            --radius: 8px;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            --transition: all 0.3s ease;
            --font-heading: 'Poppins', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-body); background-color: var(--bg-color); color: var(--text-primary); line-height: 1.5; padding: 20px; }
        .app-container { max-width: 1400px; margin: 0 auto; }

        /* Header */
        .app-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
        .header-title h1 { font-family: var(--font-heading); font-size: 2.5rem; font-weight: 700; text-align: center; }
        .date-selector select, .action-buttons button { padding: 8px 12px; border: 1px solid var(--border-color); border-radius: var(--radius); background: #fff; font-family: var(--font-body); cursor: pointer; transition: var(--transition); }
        .action-buttons button:hover { background: #f8f9fa; box-shadow: var(--shadow); }
        .divider { height: 1px; background-color: var(--border-color); margin: 10px 0 20px 0; }

        /* Auth UI */
        .user-info { display: flex; align-items: center; gap: 10px; font-weight: 600; color: var(--color-blue); }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 30px; border-radius: var(--radius); width: 350px; text-align: center; box-shadow: var(--shadow); }
        .modal-content h2 { margin-bottom: 20px; font-family: var(--font-heading); }
        .modal-content input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid var(--border-color); border-radius: 4px; font-family: var(--font-body); }
        .modal-content button { width: 100%; padding: 10px; background: var(--color-blue); color: white; border: none; border-radius: 4px; font-weight: 600; cursor: pointer; margin-bottom: 10px; }
        .modal-content button:hover { background: #2980b9; }
        .toggle-auth { color: var(--color-blue); cursor: pointer; font-size: 0.9rem; margin-top: 10px; text-decoration: underline; }
        .close-modal { background: #e74c3c !important; margin-top: 10px; }

        /* Summary Widget */
        .summary-widget { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .stat-box { flex: 1; min-width: 150px; padding: 15px; border: 1px solid var(--border-color); border-radius: var(--radius); background: #fff; box-shadow: var(--shadow); text-align: center; }
        .stat-label { display: block; font-size: 0.85rem; color: var(--text-secondary); text-transform: uppercase; }
        .stat-value { display: block; font-size: 1.5rem; font-weight: 700; font-family: var(--font-heading); margin-top: 5px; }

        /* Tracker Table */
        .tracker-wrapper { overflow-x: auto; margin-bottom: 30px; box-shadow: var(--shadow); border-radius: var(--radius); border: 1px solid var(--border-color); background: #fff; }
        #tracker-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; white-space: nowrap; }
        th, td { border: 1px solid var(--border-color); padding: 8px 4px; text-align: center; vertical-align: middle; }
        th { background-color: #f8f9fa; font-weight: 600; font-family: var(--font-heading); }
        .col-habit { min-width: 200px; text-align: left; padding-left: 10px; position: sticky; left: 0; background: #fff; z-index: 2; }
        .col-goal { min-width: 100px; position: sticky; left: 200px; background: #fff; z-index: 2;}
        .col-progress { min-width: 120px; }
        .col-streak { min-width: 60px; }
        thead th.col-habit, thead th.col-goal { z-index: 3; }
        .day-col { width: 30px; }
        .edit-input { width: 100%; border: none; background: transparent; font-family: inherit; padding: 4px; outline: none; }
        .edit-input:focus { background: #f1f8ff; border-radius: 4px; }
        
        /* Sleep Input Box */
        .sleep-input { width: 90%; border: 1px solid #b3b3b3; background-color: #fafafa; border-radius: 4px; text-align: center; font-size: 0.85rem; padding: 4px 0; outline: none; }
        .sleep-input:focus { border-color: var(--color-blue); background-color: #fff; box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2); }
        .sleep-input::-webkit-outer-spin-button, .sleep-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        
        input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; accent-color: var(--color-blue); }
        .habit-row:hover { background-color: #fcfcfc; }
        .progress-container { width: 100%; background-color: var(--border-light); border-radius: 10px; height: 12px; overflow: hidden; margin-top: 4px; }
        .progress-bar { height: 100%; width: 0%; transition: width 0.5s ease, background-color 0.5s ease; }
        
        #add-habit-btn { display: block; width: 100%; padding: 12px; background: #f8f9fa; border: none; border-top: 1px solid var(--border-color); font-weight: 600; cursor: pointer; }
        #add-habit-btn:hover { background: #eef5ff; color: var(--color-blue); }
        .btn-icon { background: none; border: none; cursor: pointer; color: var(--text-secondary); margin: 0 2px; }
        .btn-icon:hover { color: var(--color-red); }

        /* Charts */
        .charts-dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; margin-top: 30px; }
        .chart-container { background: #fff; border: 1px solid var(--border-color); border-radius: var(--radius); padding: 15px; box-shadow: var(--shadow); }

        /* Mobile & Print */
        @media (max-width: 768px) { .charts-dashboard { grid-template-columns: 1fr; } .col-habit, .col-goal { position: static; } }
        @media print {
            @page { size: landscape; margin: 5mm; }
            body { padding: 0; background: white;print-color-adjust:exact  ; -webkit-print-color-adjust: exact; }
            .action-buttons, .charts-dashboard, #add-habit-btn, .user-info { display: none; }
            .tracker-wrapper { box-shadow: none; border: none; overflow: visible !important; width: 100%; }
            #tracker-table { font-size: 9px; width: 100%; }
            th, td { border: 1px solid #000; padding: 2px 1px !important; }
            .col-habit, .col-goal { position: static !important; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        
        <!-- Auth Modal -->
        <div id="auth-modal" class="modal">
            <div class="modal-content">
                <h2 id="auth-title">Login to Save Data</h2>
                <p id="auth-error" style="color: red; font-size: 0.8rem; margin-bottom: 10px; display: none;"></p>
                <input type="email" id="auth-email" placeholder="Email Address" required>
                <input type="password" id="auth-password" placeholder="Password" required>
                <button id="auth-submit-btn" onclick="submitAuth()">Login</button>
                <p class="toggle-auth" onclick="toggleAuthMode()" id="auth-toggle-text">New user? Click here to Register</p>
                <button class="close-modal" onclick="closeAuthModal()">Cancel</button>
            </div>
        </div>

        <header class="app-header">
            <div class="date-selector">
                <select id="month-select"></select>
                <select id="year-select"></select>
            </div>
            <div class="header-title">
                <h1 id="main-title">July 2026</h1>
            </div>
            <div class="action-buttons" style="display: flex; gap: 10px; align-items: center;">
                <div id="user-display" class="user-info" style="display: none;">
                    <span id="user-email"></span>
                    <button onclick="logout()">Logout</button>
                </div>
                <button id="login-btn" onclick="openAuthModal()" style="background: var(--color-blue); color: white;">Login / Save to Cloud</button>
                <button onclick="window.print()">Print / PDF</button>
            </div>
        </header>

        <div class="divider"></div>

        <div class="summary-widget">
            <div class="stat-box"><span class="stat-label">Total Habits</span><span class="stat-value" id="stat-total-habits">0</span></div>
            <div class="stat-box"><span class="stat-label">Completion %</span><span class="stat-value" id="stat-completion-pct">0%</span></div>
            <div class="stat-box"><span class="stat-label">Sleep ≥7h Days</span><span class="stat-value" id="stat-sleep-days">0</span></div>
            <div class="stat-box"><span class="stat-label">Max Streak</span><span class="stat-value" id="stat-max-streak">0</span></div>
        </div>

        <div class="tracker-wrapper">
            <table id="tracker-table">
                <thead id="tracker-head"></thead>
                <tbody id="tracker-body"></tbody>
                <tfoot id="tracker-foot"></tfoot>
            </table>
            <button id="add-habit-btn" onclick="addHabit()">+ Add Habit</button>
        </div>

        <div class="charts-dashboard">
            <div class="chart-container"><canvas id="habitCompletionChart"></canvas></div>
            <div class="chart-container"><canvas id="dailyCompletionChart"></canvas></div>
            <div class="chart-container"><canvas id="sleepTrendChart"></canvas></div>
            <div class="chart-container"><canvas id="completionDoughnutChart"></canvas></div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. FIREBASE CONFIGURATION (UPDATED)
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyA-g2FMbUqMEcPhaL_sPMCy43QFXZQjcPs",
            authDomain: "habittracke-a3b73.firebaseapp.com",
            projectId: "habittracke-a3b73",
            storageBucket: "habittracke-a3b73.firebasestorage.app",
            messagingSenderId: "96356497696",
            appId: "1:96356497696:web:1d2523404223c8f41cff45",
            measurementId: "G-W4P2S6RF6M"
        };

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const auth = firebase.auth();

        // ==========================================
        // 2. STATE & VARIABLES
        // ==========================================
        let state = { month: new Date().getMonth(), year: new Date().getFullYear(), habits: [], sleep: {} };
        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        let chartInstances = {};
        let currentUser = null;
        let isLoginMode = true;

        // ==========================================
        // 3. AUTHENTICATION LOGIC
        // ==========================================
        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                document.getElementById('login-btn').style.display = 'none';
                document.getElementById('user-display').style.display = 'flex';
                document.getElementById('user-email').textContent = user.email;
                closeAuthModal();
                loadDataFromCloud(); 
            } else {
                currentUser = null;
                document.getElementById('login-btn').style.display = 'block';
                document.getElementById('user-display').style.display = 'none';
                loadLocalData(); 
            }
        });

        function openAuthModal() { document.getElementById('auth-modal').style.display = 'flex'; document.getElementById('auth-error').style.display = 'none'; }
        function closeAuthModal() { document.getElementById('auth-modal').style.display = 'none'; }
        
        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('auth-title').textContent = isLoginMode ? "Login to Save Data" : "Create New Account";
            document.getElementById('auth-submit-btn').textContent = isLoginMode ? "Login" : "Register";
            document.getElementById('auth-toggle-text').textContent = isLoginMode ? "New user? Click here to Register" : "Already have an account? Login";
        }

        function submitAuth() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const errorText = document.getElementById('auth-error');
            
            if(!email || !password) return;

            if(isLoginMode) {
                auth.signInWithEmailAndPassword(email, password).catch(err => {
                    errorText.textContent = err.message; errorText.style.display = 'block';
                });
            } else {
                auth.createUserWithEmailAndPassword(email, password).catch(err => {
                    errorText.textContent = err.message; errorText.style.display = 'block';
                });
            }
        }

        function logout() { auth.signOut(); state.habits = []; state.sleep = {}; render(); }

        // ==========================================
        // 4. DATA SAVING / LOADING (CLOUD + LOCAL)
        // ==========================================
        function loadDataFromCloud() {
            if(!currentUser) return;
            db.collection("users").doc(currentUser.uid).get().then((doc) => {
                if (doc.exists) {
                    state = doc.data();
                    document.getElementById('month-select').value = state.month;
                    document.getElementById('year-select').value = state.year;
                } else {
                    if (state.habits.length === 0) addHabit(true);
                }
                render();
            }).catch(error => console.error("Error getting document:", error));
        }

        function loadLocalData() {
            const saved = localStorage.getItem('habitTrackerData');
            if (saved) state = JSON.parse(saved);
            else if (state.habits.length === 0) addHabit(true);
            render();
        }

        function saveData() {
            if (currentUser) {
                db.collection("users").doc(currentUser.uid).set(state)
                  .catch(err => console.error("Error saving to cloud: ", err));
            } else {
                localStorage.setItem('habitTrackerData', JSON.stringify(state));
            }
        }

        // ==========================================
        // 5. APP LOGIC 
        // ==========================================
        function init() {
            populateDateSelectors();
            document.getElementById('month-select').value = state.month;
            document.getElementById('year-select').value = state.year;
            
            document.getElementById('month-select').addEventListener('change', (e) => { state.month = parseInt(e.target.value); render(); });
            document.getElementById('year-select').addEventListener('change', (e) => { state.year = parseInt(e.target.value); render(); });
        }

        function getDaysInMonth(month, year) { return new Date(year, month + 1, 0).getDate(); }
        function getDayName(year, month, day) { return new Date(year, month, day).toLocaleDateString('en-US', { weekday: 'short' }); }
        function generateDateKey(day) { return `${state.year}-${String(state.month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`; }

        function render() {
            document.getElementById('main-title').textContent = `${monthNames[state.month]} ${state.year}`;
            renderTableHeaders(); renderTableBody(); renderTableFooter(); updateSummaryStats(); renderCharts(); saveData();
        }

        function renderTableHeaders() {
            const thead = document.getElementById('tracker-head');
            const days = getDaysInMonth(state.month, state.year);
            let weekHeaders = ''; let currentWeekDays = 0; let weekCount = 1;
            for (let i = 1; i <= days; i++) {
                currentWeekDays++;
                let isLastDayOfWeek = new Date(state.year, state.month, i).getDay() === 0;
                if (isLastDayOfWeek || i === days) { weekHeaders += `<th colspan="${currentWeekDays}">Week ${weekCount}</th>`; weekCount++; currentWeekDays = 0; }
            }
            let html = `<tr><th rowspan="2" class="col-habit">Habits</th><th rowspan="2" class="col-goal">Goal</th>${weekHeaders}<th rowspan="2" class="col-progress">Progress</th><th colspan="2" class="col-streak">Streak</th></tr><tr>`;
            for (let i = 1; i <= days; i++) { html += `<th class="day-col"><div style="font-size:0.7rem; color:#777;">${getDayName(state.year, state.month, i).substring(0,3)}</div><div>${i}</div></th>`; }
            html += `<th class="col-streak">Cur</th><th class="col-streak">Max</th></tr>`;
            thead.innerHTML = html;
        }

        function renderTableBody() {
            const tbody = document.getElementById('tracker-body');
            const days = getDaysInMonth(state.month, state.year);
            tbody.innerHTML = '';
            state.habits.forEach((habit, index) => {
                const tr = document.createElement('tr');
                tr.className = 'habit-row';
                let completedDays = 0; let checksHtml = '';
                for (let i = 1; i <= days; i++) {
                    const dateKey = generateDateKey(i);
                    const isChecked = habit.checks && habit.checks[dateKey] ? 'checked' : '';
                    if (isChecked) completedDays++;
                    checksHtml += `<td class="day-col"><input type="checkbox" ${isChecked} onchange="toggleHabit('${habit.id}', ${i}, this.checked)"></td>`;
                }
                const pct = days > 0 ? Math.round((completedDays / days) * 100) : 0;
                const color = pct >= 80 ? 'var(--color-green)' : (pct >= 50 ? 'var(--color-yellow)' : 'var(--color-red)');
                const streaks = calculateStreak(habit);
                tr.innerHTML = `
                    <td class="col-habit">
                        <input type="text" class="edit-input" style="width: 70%;" value="${habit.name}" onchange="updateHabitData('${habit.id}', 'name', this.value)">
                        <button class="btn-icon" onclick="deleteHabit('${habit.id}')" title="Delete">✕</button>
                    </td>
                    <td class="col-goal"><input type="text" class="edit-input" value="${habit.goal}" onchange="updateHabitData('${habit.id}', 'goal', this.value)"></td>
                    ${checksHtml}
                    <td class="col-progress"><div style="display:flex; justify-content:space-between; font-size:0.8rem;"><span>${completedDays}/${days}</span><span>${pct}%</span></div><div class="progress-container"><div class="progress-bar" style="width: ${pct}%; background-color: ${color}"></div></div></td>
                    <td class="col-streak">${streaks.current}</td><td class="col-streak">${streaks.max}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderTableFooter() {
            const tfoot = document.getElementById('tracker-foot');
            const days = getDaysInMonth(state.month, state.year);
            let totalChecksHtml = ''; let sleepHtml = '';
            for (let i = 1; i <= days; i++) {
                const dateKey = generateDateKey(i);
                let totalCompleted = 0;
                state.habits.forEach(h => { if (h.checks && h.checks[dateKey]) totalCompleted++; });
                totalChecksHtml += `<td><strong>${totalCompleted}</strong></td>`;
                const sleepVal = state.sleep[dateKey] || '';
                sleepHtml += `<td><input type="number" class="sleep-input" placeholder="-" min="0" max="24" value="${sleepVal}" onchange="updateSleep(${i}, this.value)"></td>`;
            }
            tfoot.innerHTML = `<tr style="background:#f8f9fa;"><td colspan="2" style="text-align:right; padding-right:10px;"><strong>Total Habits Completed</strong></td>${totalChecksHtml}<td colspan="3"></td></tr><tr><td colspan="2" style="text-align:right; padding-right:10px;"><strong>Hours Slept</strong></td>${sleepHtml}<td colspan="3"></td></tr>`;
        }

        function addHabit(isInitial = false) { state.habits.push({ id: 'h_' + Date.now(), name: isInitial ? 'Morning Workout' : 'New Habit', goal: 'Daily', checks: {} }); render(); }
        function deleteHabit(id) { if(confirm('Delete this habit?')) { state.habits = state.habits.filter(h => h.id !== id); render(); } }
        function updateHabitData(id, field, value) { const habit = state.habits.find(h => h.id === id); if (habit) { habit[field] = value; saveData(); } }
        
        function toggleHabit(id, day, isChecked) {
            const habit = state.habits.find(h => h.id === id);
            if (habit) {
                if (!habit.checks) habit.checks = {};
                const dateKey = generateDateKey(day);
                if (isChecked) habit.checks[dateKey] = true; else delete habit.checks[dateKey];
                render(); 
            }
        }

        function updateSleep(day, value) {
            const dateKey = generateDateKey(day);
            if (value === '') delete state.sleep[dateKey]; else state.sleep[dateKey] = parseFloat(value);
            render();
        }

        function calculateStreak(habit) {
            if (!habit.checks) return { current: 0, max: 0 };
            let dates = Object.keys(habit.checks).sort();
            if (dates.length === 0) return { current: 0, max: 0 };
            let current = 1; let max = 1;
            for (let i = 1; i < dates.length; i++) {
                let diffDays = Math.ceil(Math.abs(new Date(dates[i]) - new Date(dates[i-1])) / (1000 * 60 * 60 * 24)); 
                if (diffDays === 1) { current++; if (current > max) max = current; } else { current = 1; }
            }
            return { current, max };
        }

        function updateSummaryStats() {
            const days = getDaysInMonth(state.month, state.year);
            let totalChecks = 0; let maxStreakTracker = 0;
            state.habits.forEach(h => {
                if(h.checks) totalChecks += Object.keys(h.checks).filter(k => k.startsWith(`${state.year}-${String(state.month+1).padStart(2,'0')}`)).length;
                const streaks = calculateStreak(h);
                if(streaks.max > maxStreakTracker) maxStreakTracker = streaks.max;
            });
            let completionPct = (state.habits.length * days) > 0 ? Math.round((totalChecks / (state.habits.length * days)) * 100) : 0;
            let goodSleepDays = 0;
            for (let i = 1; i <= days; i++) { let dk = generateDateKey(i); if(state.sleep[dk] >= 7) goodSleepDays++; }
            document.getElementById('stat-total-habits').textContent = state.habits.length;
            document.getElementById('stat-completion-pct').textContent = `${completionPct}%`;
            document.getElementById('stat-sleep-days').textContent = goodSleepDays;
            document.getElementById('stat-max-streak').textContent = maxStreakTracker;
        }

        function renderCharts() {
            Chart.defaults.font.family = "'Inter', sans-serif";
            const days = getDaysInMonth(state.month, state.year);
            const labelsDays = Array.from({length: days}, (_, i) => i + 1);
            let dailyCompletions = new Array(days).fill(0); let habitNames = []; let habitCompletions = []; let sleepData = [];
            labelsDays.forEach(d => { sleepData.push(state.sleep[generateDateKey(d)] || 0); });
            state.habits.forEach(h => {
                habitNames.push(h.name || 'Unnamed'); let count = 0;
                labelsDays.forEach(d => { if(h.checks && h.checks[generateDateKey(d)]) { count++; dailyCompletions[d-1]++; } });
                habitCompletions.push(count);
            });
            createOrUpdateChart('habitCompletionChart', 'bar', { labels: habitNames, datasets: [{ label: 'Days Completed', data: habitCompletions, backgroundColor: '#3498db' }] });
            createOrUpdateChart('dailyCompletionChart', 'line', { labels: labelsDays, datasets: [{ label: 'Habits Done', data: dailyCompletions, borderColor: '#2ecc71', backgroundColor: 'rgba(46, 204, 113, 0.2)', fill: true }] });
            createOrUpdateChart('sleepTrendChart', 'line', { labels: labelsDays, datasets: [{ label: 'Hours Slept', data: sleepData, borderColor: '#9b59b6', backgroundColor: 'rgba(155, 89, 182, 0.2)', fill: true }] });
            let totalDone = habitCompletions.reduce((a,b)=>a+b, 0);
            createOrUpdateChart('completionDoughnutChart', 'doughnut', { labels: ['Completed', 'Missed'], datasets: [{ data: [totalDone, (state.habits.length * days) - totalDone], backgroundColor: ['#2ecc71', '#e74c3c'] }] });
        }

        function createOrUpdateChart(id, type, data) {
            const ctx = document.getElementById(id);
            if (chartInstances[id]) { chartInstances[id].data = data; chartInstances[id].update(); } 
            else { chartInstances[id] = new Chart(ctx, { type: type, data: data, options: { responsive: true, maintainAspectRatio: false } }); ctx.style.height = '250px'; }
        }

        function populateDateSelectors() {
            const ms = document.getElementById('month-select'); monthNames.forEach((m, i) => { ms.innerHTML += `<option value="${i}">${m}</option>`; });
            const ys = document.getElementById('year-select'); let currYr = new Date().getFullYear(); for(let i = currYr - 5; i <= currYr + 5; i++) { ys.innerHTML += `<option value="${i}">${i}</option>`; }
        }

        window.onload = init;
    </script>
</body>
